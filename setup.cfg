[metadata]
name = pkginfo2
version = 30.1.0
license = MIT

description = Query metadata from sdists / bdists / installed packages. Safer fork of pkginfo to avoid doing arbitrary imports and eval.
long_description = file:README.rst
long_description_content_type = text/x-rst
url = https://github.com/aboutcode-org/pkginfo2

author = Maintained by nexB, Inc. Authored by Tres Seaver, Agendaless Consulting
author_email = tseaver@agendaless.com

classifiers =
    Development Status :: 5 - Production/Stable
    Intended Audience :: Developers
    Operating System :: OS Independent
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Programming Language :: Python :: 3.14
    Programming Language :: Python :: 3 :: Only
    Topic :: Software Development :: Libraries :: Python Modules
    Topic :: System :: Software Distribution
    Topic :: Software Development
    Topic :: Utilities

keywords =
    distribution
    sdist
    installed
    metadata

license_files =
    mit.LICENSE
    CHANGELOG.rst
    CODE_OF_CONDUCT.rst
    README.rst

[options]
python_requires = >=3.10

package_dir =
    =src
packages = find:
include_package_data = true
zip_safe = false

install_requires =


[options.packages.find]
where = src


[options.extras_require]
dev =
    pytest >= 7.0.1
    pytest-xdist >= 2
    aboutcode-toolkit >= 7.0.2
    twine
    ruff
    Sphinx>=5.0.2
    sphinx-rtd-theme>=1.0.0
    sphinx-reredirects >= 0.1.2
    doc8>=0.11.2
    sphinx-autobuild
    sphinx-rtd-dark-mode>=1.3.0
    sphinx-copybutton

[options.entry_points]
console_scripts =
    pkginfo2 = pkginfo2.commandline:main
